name: Sleep Video Factory

on:
  schedule:
    - cron: "17 6 * * *"
  repository_dispatch:
    types: [build_sleep_video]
  workflow_dispatch:
    inputs:
      video_title:
        description: "Title (blank = next line of topics.txt)"
        required: false
        default: ""
      topic_lens:
        description: "Topic / lens (blank = next line of topics.txt)"
        required: false
        default: ""
      num_chapters:
        description: "Chapters (2 = ~15 min test, 18 = ~3 h)"
        required: true
        default: "2"
      privacy:
        description: "YouTube privacy"
        type: choice
        options: [private, unlisted, public]
        default: private

permissions:
  contents: write
  models: read

concurrency:
  group: sleep-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg (static build, no apt)
        run: |
          set -e
          curl -fsSL --retry 5 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /opt/ffmpeg && tar -xf /tmp/ff.tar.xz -C /opt/ffmpeg --strip-components=1
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"
          /opt/ffmpeg/bin/ffmpeg -hide_banner -version | head -1
          ls /usr/share/fonts/truetype/dejavu/ || echo "no dejavu fonts (chapter labels will be skipped)"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build and upload video
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MAKE_CALLBACK_WEBHOOK_URL: ${{ secrets.MAKE_CALLBACK_WEBHOOK_URL }}
          VIDEO_TITLE: ${{ github.event.client_payload.video_title || inputs.video_title }}
          TOPIC_LENS: ${{ github.event.client_payload.topic_lens || inputs.topic_lens }}
          NUM_CHAPTERS: ${{ github.event.client_payload.num_chapters || inputs.num_chapters || vars.NUM_CHAPTERS || '18' }}
          VOICE_NAME: ${{ github.event.client_payload.voice_name || vars.VOICE_NAME || 'en-US-AndrewMultilingualNeural' }}
          SHEET_ROW_ID: ${{ github.event.client_payload.sheet_row_id }}
          PRIVACY_STATUS: ${{ inputs.privacy || vars.PRIVACY_STATUS || 'private' }}
          OUT_DIR: out
        run: python -m factory.main

      - name: Commit topic queue
        if: success()
        run: |
          git config user.name "sleep-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.txt topics_done.txt 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "queue: mark topic done [skip ci]" && git pull --rebase && git push; }

      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleep-video-${{ github.run_number }}
          path: out/
          retention-days: 5
          if-no-files-found: ignore
