name: Zero-Dollar Daily YouTube Sleep Video Factory

on:
  repository_dispatch:
    types: [build_sleep_video]
  workflow_dispatch:
    inputs:
      video_title:
        description: 'YouTube Video Title'
        required: true
        default: 'Boring History For Sleep: A Rainy Night in a 14th-Century Monastery'
      topic_lens:
        description: 'Historical/Science Micro-Lens'
        required: true
        default: 'Daily nocturnal routines, scriptorium candle-making, and rain-lit cloisters of a 14th-century medieval monastery'
      num_chapters:
        description: 'Number of Chapters (18 = ~3 hours, 2 = fast test)'
        required: true
        default: '18'

permissions:
  contents: read
  models: read

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.11 & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Free Dependencies (edge-tts + YouTube API Client)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --upgrade pip
          pip install requests edge-tts google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: 4. Run Zero-Credit-Card Sleep Video Generator & Private YouTube Uploader
        env:
          # Automatic Built-in GitHub Token (Zero Signup, Zero Credit Card!)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 100% No-Credit-Card Free LLM Keys (Add any 1 or more in GitHub Secrets)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Free Pexels Video Key + Make.com Callback Webhook
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MAKE_CALLBACK_WEBHOOK_URL: ${{ secrets.MAKE_CALLBACK_WEBHOOK_URL }}
          # Non-Expiring YouTube OAuth2 Credentials
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Payload from Make.com (or manual test defaults)
          SHEET_ROW_ID: ${{ github.event.client_payload.sheet_row_id || '2' }}
          VIDEO_TITLE: "${{ github.event.client_payload.video_title || inputs.video_title || 'Boring History For Sleep: A Rainy Night in a 14th-Century Monastery' }}"
          TOPIC_LENS: "${{ github.event.client_payload.topic_lens || inputs.topic_lens || 'Daily nocturnal routines, scriptorium candle-making, and rain-lit cloisters of a 14th-century medieval monastery' }}"
          NUM_CHAPTERS: ${{ github.event.client_payload.num_chapters || inputs.num_chapters || '18' }}
          VOICE_NAME: ${{ github.event.client_payload.voice_name || 'en-US-AndrewMultilingualNeural' }}
        run: |
          python3 sleep_video_worker.py
