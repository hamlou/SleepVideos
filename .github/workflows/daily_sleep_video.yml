name: Sleep Video Factory

on:
  schedule:
    - cron: "7 1 * * *"
  repository_dispatch:
    types: [build_sleep_video, render_now]
  workflow_dispatch:
    inputs:
      num_chapters:
        description: "Chapters (blank = bot setting; 2 = quick test)"
        required: false
        default: ""

permissions:
  contents: write
  models: read

concurrency:
  group: sleep-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - name: Paused?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q '"paused": *true' data/settings.json 2>/dev/null; then
            echo "Nightly run paused from the bot."; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg (static build)
        if: steps.gate.outputs.skip != '1'
        run: |
          set -e
          curl -fsSL --retry 5 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /opt/ffmpeg && tar -xf /tmp/ff.tar.xz -C /opt/ffmpeg --strip-components=1
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Install Python deps
        if: steps.gate.outputs.skip != '1'
        run: pip install -r requirements.txt

      - name: Build and upload video
        if: steps.gate.outputs.skip != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIDEO_TITLE: ${{ github.event.client_payload.video_title }}
          TOPIC_LENS: ${{ github.event.client_payload.topic_lens }}
          NUM_CHAPTERS: ${{ github.event.client_payload.num_chapters || inputs.num_chapters }}
          OUT_DIR: out
        run: python -m factory.main

      - name: Save state
        if: always() && steps.gate.outputs.skip != '1'
        run: bash scripts/commit_data.sh "video build ${{ github.run_number }}"

      - name: Save outputs
        if: always() && steps.gate.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: sleep-video-${{ github.run_number }}
          path: out/
          retention-days: 5
          if-no-files-found: ignore
